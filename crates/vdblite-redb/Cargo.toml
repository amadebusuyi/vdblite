# A fork of redb 4.4.0 (https://github.com/cberner/redb) with one addition,
# `Builder::open_read_only_with_backend`; see FORK.md. The library keeps the
# name `redb`, so the workspace uses it as `redb::...`.
[package]
name = "vdblite-redb"
version = "4.4.0"
edition = "2024"
rust-version = "1.90"
authors = ["Christopher Berner <me@cberner.com>"]
build = "build.rs"
description = "redb 4.4.0 with read-only opens on custom storage backends, for VDBLite"
license = "Apache-2.0"
repository = "https://github.com/OWNER/vdblite"
readme = "FORK.md"
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "redb"
path = "src/lib.rs"

[features]
cache_metrics = []
default = ["std"]
experimental-api-5 = []
experimental-multiprocess = ["std", "experimental-api-5"]
experimental-niches = ["experimental-api-5"]
logging = ["dep:log"]
std = []

[dependencies]
chrono_v0_4 = { version = "0.4.41", optional = true, package = "chrono" }
log = { version = "0.4.17", optional = true }
uuid = { version = "1.17.0", optional = true }

[target.'cfg(any(target_os = "linux", target_vendor = "apple"))'.dependencies]
libc = "0.2.174"

[target.'cfg(target_os = "wasi")'.dependencies]
libc = "0.2.174"

[lints.clippy]
big_endian_bytes = "deny"
dbg_macro = "deny"
host_endian_bytes = "deny"
