[workspace]
resolver = "3"
members = [
    "crates/vecfile-core",
    "crates/vecfile-index",
    "crates/vecfile-chunk",
    "crates/vecfile",
    "bindings/node",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vecfile-core = { path = "crates/vecfile-core" }
vecfile-index = { path = "crates/vecfile-index" }
vecfile-chunk = { path = "crates/vecfile-chunk" }
rayon = "1.12"
libc = "0.2"
parking_lot = "0.13"
roaring = "0.11"
redb = { version = "4.4", features = ["experimental-multiprocess"] }
zstd = "0.14"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bytemuck = "1.25"
tempfile = "3.27"
proptest = "1.12"
criterion = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# The Node addon must unwind so a panic becomes a JS exception instead of
# aborting the host process.
[profile.release-node]
inherits = "release"
panic = "unwind"
