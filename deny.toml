# cargo-deny: dependency licenses, security advisories and sources.
# CI runs `cargo deny check`; locally: `cargo install cargo-deny && cargo deny check`.

[graph]
all-features = true

[advisories]
# Fails on any RustSec advisory (vulnerability, unsound, or unmaintained
# crate) affecting a dependency. Add an ignore entry with a reason when one
# doesn't apply.
ignore = []

[licenses]
# Permissive licenses only, so VDBLite stays usable under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace have no version wildcard to worry about.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
