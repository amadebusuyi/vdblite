[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
# "vdblite" is taken on PyPI; the module is still `import vdblite`.
name = "vdblite-py"
description = "An embedded, single-file vector database"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dynamic = ["version"]

[tool.maturin]
module-name = "vdblite"
