[package]
name = "vecfile-node"
description = "Node.js bindings for vecfile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vecfile = { path = "../../crates/vecfile" }
napi = { version = "3", features = ["napi8", "serde-json"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
