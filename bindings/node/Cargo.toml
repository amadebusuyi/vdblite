[package]
name = "vdblite-node"
description = "Node.js bindings for vdblite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vdblite = { path = "../../crates/vdblite" }
vdblite-bindings = { path = "../shared" }
napi = { version = "3", features = ["napi8", "serde-json"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
